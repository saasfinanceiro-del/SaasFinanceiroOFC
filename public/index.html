/* ─── Donut Chart ──────────────────────────────────────────── */
const DonutChart=({data,dark})=>{
  const [hov,setHov]=useState(null);
  if(!data||data.length===0)return(
    <div className="flex items-center justify-center h-48 text-slate-400 text-sm">Sem dados de despesas</div>
  );
  const total=data.reduce((a,d)=>a+d.value,0);
  if(total===0)return<div className="flex items-center justify-center h-48 text-slate-400 text-sm">Sem despesas no período</div>;
  const R=70,r=42,CX=90,CY=90;
  let angle=-Math.PI/2;
  const slices=data.map(d=>{
    const pct=d.value/total;
    const sweep=pct*2*Math.PI;
    const x1=CX+R*Math.cos(angle),y1=CY+R*Math.sin(angle);
    angle+=sweep;
    const x2=CX+R*Math.cos(angle),y2=CY+R*Math.sin(angle);
    const xi1=CX+r*Math.cos(angle-sweep),yi1=CY+r*Math.sin(angle-sweep);
    const xi2=CX+r*Math.cos(angle),yi2=CY+r*Math.sin(angle);
    const large=sweep>Math.PI?1:0;
    const path=`M${x1},${y1} A${R},${R} 0 ${large},1 ${x2},${y2} L${xi2},${yi2} A${r},${r} 0 ${large},0 ${xi1},${yi1} Z`;
    return{...d,path,pct};
  });
  const hovSlice=hov!==null?slices[hov]:null;
  return(
    <div className="flex flex-col lg:flex-row items-center gap-6">
      <div className="relative shrink-0">
        <svg width="180" height="180" viewBox="0 0 180 180">
          {slices.map((s,i)=>(
            <path key={i} d={s.path} fill={s.color} opacity={hov===null||hov===i?1:.4}
              onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}
              style={{cursor:'pointer',transition:'opacity .15s'}}/>
          ))}
          <circle cx={CX} cy={CY} r={r-4} fill={dark?'#0f172a':'#f8fafc'}/>
          <text x={CX} y={CY-8} textAnchor="middle" fontSize="10" fontWeight="700" fill={dark?'#94a3b8':'#64748b'} fontFamily="Inter,sans-serif">
            {hovSlice?hovSlice.name:'Total'}
          </text>
          <text x={CX} y={CY+10} textAnchor="middle" fontSize="13" fontWeight="800" fill={dark?'#f1f5f9':'#1e293b'} fontFamily="Inter,sans-serif">
            {hovSlice?`${Math.round(hovSlice.pct*100)}%`:'100%'}
          </text>
          <text x={CX} y={CY+24} textAnchor="middle" fontSize="8" fontWeight="600" fill={dark?'#64748b':'#94a3b8'} fontFamily="Inter,sans-serif">
            {hovSlice?`R$ ${fM(hovSlice.value)}`:`R$ ${fM(total)}`}
          </text>
        </svg>
      </div>
      <div className="flex-1 grid grid-cols-1 gap-1.5 w-full min-w-0">
        {slices.sort((a,b)=>b.value-a.value).map((s,i)=>(
          <div key={i} onMouseEnter={()=>setHov(slices.indexOf(s))} onMouseLeave={()=>setHov(null)}
            className={`flex items-center gap-2.5 p-2 rounded-lg cursor-pointer transition-all ${hov===slices.indexOf(s)?th('bg-slate-100','bg-slate-800'):''}`}>
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{backgroundColor:s.color}}></span>
            <span className={`text-xs font-semibold truncate flex-1 ${dark?'text-slate-300':'text-slate-600'}`}>{s.name}</span>
            <span className={`text-xs font-bold tabular-nums shrink-0 ${dark?'text-slate-400':'text-slate-500'}`}>{Math.round(s.pct*100)}%</span>
            <span className={`text-xs font-bold tabular-nums shrink-0 ${dark?'text-white':'text-slate-800'}`}>R$ {fM(s.value)}</span>
          </div>
        ))}
      </div>
    </div>
  );
  function th(l,d){return dark?d:l;}
};

  useEffect(()=>{

  },[user,fbReady,workspaceOwnerUid,isOwner]);

  const sv=async(col,id,data)=>{if(!user||!fbReady||!workspaceOwnerUid)return;setCs('syncing');try{const{doc,setDoc}=window.__fb;await setDoc(doc(window.__db,'ugrup',workspaceOwnerUid,col,String(id)),data);setCs('synced');}catch{setCs('error');}};
  const rm=async(col,id)=>{if(!user||!fbReady||!workspaceOwnerUid)return;setCs('syncing');try{const{doc,deleteDoc}=window.__fb;await deleteDoc(doc(window.__db,'ugrup',workspaceOwnerUid,col,String(id)));setCs('synced');}catch{setCs('error');}};

  const genToken=()=>Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);

  const createInvite=async(e)=>{

  };

  const removeMember=async(memberUid)=>{
    try{
      const{doc,deleteDoc,setDoc}=window.__fb;
      const db=window.__db;
      await deleteDoc(doc(db,'ugrup',user.uid,'members',memberUid));
      await setDoc(doc(db,'userProfiles',memberUid),{workspaceOwnerUid:null,role:'owner'});
    }catch(err){alert('Erro ao remover membro.');}
  };

  /* Expand recurrences */
  const exp=useMemo(()=>{
    /* FIX 16: String keys for consistent realized lookup */
    const real=txns.reduce((acc,t)=>{
      if(t.realizedBaseId&&t.realizedIndex!==undefined){
        if(!acc[t.realizedBaseId])acc[t.realizedBaseId]=new Set();
        acc[t.realizedBaseId].add(String(t.realizedIndex));
      }
      return acc;
    },{});
    /* FIX 11: max date = 24 months from today */
    const mxD=new Date(tStr()+'T12:00:00');mxD.setMonth(mxD.getMonth()+24);
    const maxDate=`${mxD.getFullYear()}-${String(mxD.getMonth()+1).padStart(2,'0')}-01`;
    const out=[];
    txns.forEach(t=>{
      if(t.realizedBaseId)return;
      out.push({...t});
      if(!t.isRecurring)return;
      /* FIX 12: extended intervals */
      const getNext=(base,i)=>{
        if(t.recurrenceInterval==='weekly')return aD(base,i*7);
        if(t.recurrenceInterval==='biweekly')return aD(base,i*14);
        if(t.recurrenceInterval==='quarterly')return aM(base,i*3);
        if(t.recurrenceInterval==='semiannual')return aM(base,i*6);
        if(t.recurrenceInterval==='yearly')return aM(base,i*12);
        return aM(base,i);
      };
      const maxIter=t.recurrenceType==='installments'&&t.installmentsCount?parseInt(t.installmentsCount,10):200;
      for(let i=1;i<maxIter;i++){
        const nd=getNext(t.date,i);
        if(t.recurrenceType==='continuous'&&nd>=maxDate)break; /* FIX 11 */
        if(real[t.id]?.has(String(i)))continue; /* FIX 16 */
        const bd=t.description.replace(/ \(Parcela \d+\/\d+\)$/,'');
        const lbl=t.recurrenceType==='installments'?` (Parcela ${i+1}/${t.installmentsCount})`:'';
        out.push({...t,id:`${t.id}-v-${i}`,baseId:t.id,recIndex:i,date:nd,status:'pending',isVirtual:true,description:`${bd}${lbl}`});
      }
    });
    return out;
  },[txns]);

  /* Dashboard stats */
  const dItems=useMemo(()=>exp.filter(t=>{if(ent!=='all'&&t.entityId!==ent)return false;const[y,m]=t.date.split('-').map(Number);return(m-1)===vd.getMonth()&&y===vd.getFullYear();}).sort((a,b)=>new Date(a.date)-new Date(b.date)),[exp,ent,vd]);
  /* FIX 2/4: filter by text search AND category tag */
  const fdItems=useMemo(()=>{
    let out=dItems;
    if(srch)out=out.filter(t=>t.description.toLowerCase().includes(srch.toLowerCase())||t.category.toLowerCase().includes(srch.toLowerCase()));
    if(catFilter)out=out.filter(t=>t.category===catFilter);
    return out;
  },[dItems,srch,catFilter]);
  /* ── Tax deductions ── */
  const taxTotal=useMemo(()=>{
    const pI=dItems.filter(t=>t.type==='income'&&t.status==='paid').reduce((a,t)=>a+t.amount,0);
    const pIpend=dItems.filter(t=>t.type==='income'&&t.status==='pending').reduce((a,t)=>a+t.amount,0);
    // Sum all impostos aliquotas (%)
    const impostoRate=impostos.reduce((a,imp)=>a+parseFloat(imp.aliquota||0),0)/100;
    // Sum all taxas: percentual on income, fixo per transaction
    const taxaRate=taxas.filter(t=>t.tipo==='percentual').reduce((a,tx)=>a+parseFloat(tx.valor||0),0)/100;
    const taxaFixoPaid=taxas.filter(t=>t.tipo==='fixo').length*dItems.filter(t=>t.type==='income'&&t.status==='paid').length*taxas.filter(t=>t.tipo==='fixo').reduce((a,tx)=>a+parseFloat(tx.valor||0),0);
    const dedPaid=pI*(impostoRate+taxaRate)+taxaFixoPaid;
    const dedPend=pIpend*(impostoRate+taxaRate);
    return{dedPaid:Math.round(dedPaid*100)/100,dedPend:Math.round(dedPend*100)/100,rate:Math.round((impostoRate+taxaRate)*10000)/100};
  },[dItems,impostos,taxas]);
  const dSt=useMemo(()=>{
    const pI=dItems.filter(t=>t.type==='income'&&t.status==='paid').reduce((a,t)=>a+t.amount,0);
    const pO=dItems.filter(t=>t.type==='expense'&&t.status==='paid').reduce((a,t)=>a+t.amount,0);
    const peI=dItems.filter(t=>t.type==='income'&&t.status==='pending').reduce((a,t)=>a+t.amount,0);
    const peO=dItems.filter(t=>t.type==='expense'&&t.status==='pending').reduce((a,t)=>a+t.amount,0);
    const tot=pI+pO;
    const ded=taxTotal.dedPaid;
    const dedPend=taxTotal.dedPend;
    return{pI,pO,peI,peO,ded,dedPend,bal:pI-pO-ded,exp:(pI-pO-ded)+(peI-peO-dedPend),iP:tot?pI/tot*100:0,oP:tot?pO/tot*100:0};
  },[dItems,taxTotal]);
  /* FIX 10: only real paid transactions — never virtual */
  const gBal=useMemo(()=>txns.filter(t=>t.status==='paid'&&!t.isVirtual).reduce((a,t)=>a+(t.type==='income'?t.amount:-t.amount),0),[txns]);

  /* Donut data: expenses by category for current month */
  const donutData=useMemo(()=>{
    const expItems=dItems.filter(t=>t.type==='expense'&&t.status==='paid');
    const bycat={};
    expItems.forEach(t=>{bycat[t.category]=(bycat[t.category]||0)+t.amount;});
    return Object.entries(bycat).map(([name,value])=>({name,value,color:catColor(name)})).sort((a,b)=>b.value-a.value).slice(0,8);
  },[dItems,cats]);

  /* Forecast */
  const fAll=useMemo(()=>exp.filter(t=>{if(t.status!=='pending')return false;if(ent!=='all'&&t.entityId!==ent)return false;const diff=dDiff(t.date);if(diff<0)return true;if(pf==='all')return true;return diff<=parseInt(pf,10);}).sort((a,b)=>new Date(a.date)-new Date(b.date)),[exp,ent,pf]);
  const ovItems=useMemo(()=>fAll.filter(t=>dDiff(t.date)<0),[fAll]);
  const tdItems=useMemo(()=>fAll.filter(t=>dDiff(t.date)===0),[fAll]);
  const fuItems=useMemo(()=>fAll.filter(t=>dDiff(t.date)>0),[fAll]);
  const projIn=useMemo(()=>fAll.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),[fAll]);
  const projOut=useMemo(()=>fAll.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),[fAll]);
  /* FIX 5: projFin must be useMemo so React re-renders when deps change */
  const projFin=useMemo(()=>gBal+projIn-projOut,[gBal,projIn,projOut]);
  const ovExp=useMemo(()=>ovItems.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),[ovItems]);

  /* Unit balances — FIX 10: exclude virtual */
  const unitBal=useMemo(()=>{
    const m={};
    txns.filter(t=>!t.isVirtual).forEach(t=>{
      const k=t.entityId||'all';
      if(!m[k])m[k]={bal:0,inc:0,exp:0,pend:0};
      if(t.status==='paid'){
        const v=t.type==='income'?t.amount:-t.amount;
        m[k].bal=(m[k].bal||0)+v;
        if(t.type==='income')m[k].inc=(m[k].inc||0)+t.amount;
        else m[k].exp=(m[k].exp||0)+t.amount;
      } else {
        m[k].pend=(m[k].pend||0)+(t.type==='income'?t.amount:-t.amount);
      }
    });
    return m;
  },[txns]);

  /* Efetivar */
  const openEf=t=>setEfMod({o:true,tx:t,date:tStr()});
  const confEf=()=>{
    const{tx,date}=efMod;
    if(tx.isVirtual){
      const bd=tx.description.replace(/ \(Parcela \d+\/\d+\)$/,'');
      const lbl=tx.recurrenceType==='installments'?` (Parcela ${tx.recIndex+1}/${tx.installmentsCount})`:'';
      /* FIX 16: realizedIndex as String, date = actual payment date */
      sv('transactions',`tx-r-${Date.now()}`,{description:`${bd}${lbl}`,amount:tx.amount,type:tx.type,category:tx.category,entityId:tx.entityId,date,status:'paid',note:tx.note||'',isRecurring:false,realizedBaseId:tx.baseId,realizedIndex:String(tx.recIndex)});
    }else{const{id,...rest}=tx;sv('transactions',id,{...rest,status:'paid',date});}
    setEfMod({o:false,tx:null,date:''});
  };

  /* CRUD */
  const openC=()=>{setMMode('create');setEditId(null);setForm({...blank,date:tStr(),category:cats[0]?.name||'Geral'});setShowModal(true);};
  const openE=t=>{
    if(t.isVirtual){alert('⚠️ Parcela automática.\nEditar afetará o lançamento base e todas as recorrências.');const base=txns.find(tx=>tx.id===t.baseId);if(!base)return;setMMode('edit');setEditId(base.id);setForm({...base});}
    else{setMMode('edit');setEditId(t.id);setForm({...t});}
    setShowModal(true);
  };
  const hSv=e=>{e.preventDefault();const p={...form,amount:parseFloat(form.amount),installmentsCount:form.isRecurring&&form.recurrenceType==='installments'?form.installmentsCount:''};delete p.isVirtual;delete p.baseId;delete p.recIndex;sv('transactions',mMode==='create'?`tx-${Date.now()}`:String(editId),p);setShowModal(false);};
  const rDel=t=>setCDel({o:true,type:'transaction',id:t.isVirtual?t.baseId:t.id,title:t.description,warn:t.isVirtual||t.isRecurring?'Apagará o lançamento base e TODAS as parcelas futuras.':''});

  /* FIX 1/2/3: Delete with migration and default restore */
  const DEFAULT_CATS_R=[
    {id:'c1',name:'Vendas',color:'#10b981'},{id:'c2',name:'Serviços',color:'#6366f1'},
    {id:'c3',name:'Consultoria',color:'#3b82f6'},{id:'c4',name:'Geral',color:'#94a3b8'},
    {id:'c5',name:'Impostos',color:'#f43f5e'},{id:'c6',name:'Folha Salarial',color:'#f59e0b'},
  ];
  const DEFAULT_ENTS_R=[
    {id:'e-1',name:'Empresa Principal',type:'company'},
    {id:'c-1',name:'Cartão Principal',type:'card'},
  ];
  const xDel=()=>{
    const{type,id}=cDel;
    const done=()=>setCDel({o:false,type:null,id:null,title:'',warn:''});
    if(type==='transaction'){
      rm('transactions',id);done();
    }else if(type==='entity'){
      // FIX: migrate transactions to 'all', no auto-restore
      const affected=txns.filter(t=>t.entityId===id);
      Promise.all(affected.map(t=>{const{id:tid,...rest}=t;return sv('transactions',tid,{...rest,entityId:'all'});}))
        .then(()=>rm('entities',id))
        .then(()=>done());
    }else if(type==='category'){
      // FIX: migrate transactions to 'Geral', no auto-restore
      const cn=cats.find(c=>c.id===id)?.name;
      const fallback=cats.find(c=>c.id!==id)?.name||'Geral';
      const affected=cn&&cn!==fallback?txns.filter(t=>t.category===cn):[];
      Promise.all(affected.map(t=>{const{id:tid,...rest}=t;return sv('transactions',tid,{...rest,category:fallback});}))
        .then(()=>rm('categories',id))
        .then(()=>done());
    }else if(type==='contact'){
      rm('contacts',id);done();
    }else{done();}
  };

  /* Abre modal especial de exclusão de categoria */
  const openCatDel=(cat)=>{
    const count=txns.filter(t=>t.category===cat.name).length;
    const total=txns.filter(t=>t.category===cat.name).reduce((a,t)=>a+t.amount,0);
    const otherCats=cats.filter(c=>c.id!==cat.id);
    setCatDelModal({o:true,cat,count,total,action:count>0?'migrate':'delete',targetCat:otherCats[0]?.name||''});
  };

  /* Confirma exclusão de categoria com ação escolhida */
  const confCatDel=()=>{
    const{cat,action,targetCat}=catDelModal;
    if(!cat)return;
    const affected=txns.filter(t=>t.category===cat.name);
    if(action==='delete'){
      // Exclui categoria E todos os lançamentos vinculados
      Promise.all([
        ...affected.map(t=>rm('transactions',t.id)),
        rm('categories',cat.id)
      ]).then(()=>setCatDelModal({o:false,cat:null,count:0,total:0,action:'migrate',targetCat:''}));
    }else{
      // Migra lançamentos para a categoria escolhida
      const dest=targetCat||cats.find(c=>c.id!==cat.id)?.name||'Geral';
      Promise.all(affected.map(t=>{const{id:tid,...rest}=t;return sv('transactions',tid,{...rest,category:dest});}))
        .then(()=>rm('categories',cat.id))
        .then(()=>setCatDelModal({o:false,cat:null,count:0,total:0,action:'migrate',targetCat:''}));
    }
  };
  /* Point 4: category search */
  const filteredCats=useMemo(()=>!catSearch?cats:cats.filter(c=>c.name.toLowerCase().includes(catSearch.toLowerCase())),[cats,catSearch]);

  /* Point 5: Professional accounting-grade CSV export */
  const hExp=(items,reportName,period)=>{
    const now=new Date().toLocaleString('pt-BR');
    const emitDate=new Date().toLocaleDateString('pt-BR');
    const paid=items.filter(t=>t.status==='paid');
    const pend=items.filter(t=>t.status==='pending');
    const tInc=paid.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
    const tExp=paid.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
    const tIncPend=pend.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0);
    const tExpPend=pend.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
    const saldo=tInc-tExp;
    const byCat={};
    items.forEach(t=>{
      if(!byCat[t.category])byCat[t.category]={incPaid:0,expPaid:0,incPend:0,expPend:0,n:0};
      const c=byCat[t.category];c.n++;
      if(t.type==='income'){if(t.status==='paid')c.incPaid+=t.amount;else c.incPend+=t.amount;}
      else{if(t.status==='paid')c.expPaid+=t.amount;else c.expPend+=t.amount;}
    });
    const byEnt={};
    items.forEach(t=>{
      const n=entities.find(e=>e.id===t.entityId)?.name||(personalAcc.name||'Conta Pessoal');
      if(!byEnt[n])byEnt[n]={inc:0,exp:0};

    });
    const sorted=[...items].sort((a,b)=>new Date(a.date)-new Date(b.date));
    const R=(...cols)=>cols.join(';');
    const M=v=>'R$ '+fM(v);
    const totAmt=items.reduce((a,t)=>a+t.amount,0);
    const rows=[
      R('EMPRESA','Kontaê'),
      R('RELATORIO',reportName,'PERIODO',period,'EMISSAO',emitDate,'GERADO EM',now),
      R(''),
      R('========== RESUMO EXECUTIVO =========='),
      R(''),
      R('INDICADOR','REALIZADO (R$)','PREVISTO (R$)','TOTAL (R$)','% DO TOTAL'),
      R('Receitas',M(tInc),M(tIncPend),M(tInc+tIncPend),totAmt?((tInc+tIncPend)/totAmt*100).toFixed(1)+'%':'0%'),
      R('Despesas',M(tExp),M(tExpPend),M(tExp+tExpPend),totAmt?((tExp+tExpPend)/totAmt*100).toFixed(1)+'%':'0%'),
      R('Saldo Liquido',M(saldo),'',M(saldo+(tIncPend-tExpPend)),''),
      R(''),
      R('========== POR CATEGORIA =========='),
      R(''),
      R('CATEGORIA','RECEITAS EFETIVADAS','DESPESAS EFETIVADAS','SALDO','RECEITAS PREVISTAS','DESPESAS PREVISTAS','QTD','% DESPESAS REAIS'),
      ...Object.entries(byCat).sort((a,b)=>b[1].expPaid-a[1].expPaid).map(([cat,v])=>
        R(cat,M(v.incPaid),M(v.expPaid),M(v.incPaid-v.expPaid),M(v.incPend),M(v.expPend),v.n,tExp>0?((v.expPaid/tExp)*100).toFixed(1)+'%':'0%')
      ),
      R('TOTAL',M(tInc),M(tExp),M(saldo),M(tIncPend),M(tExpPend),items.length,'100%'),
      R(''),
      R('========== POR CONTA / UNIDADE =========='),
      R(''),
      R('CONTA / UNIDADE','RECEITAS (R$)','DESPESAS (R$)','SALDO (R$)'),
      ...Object.entries(byEnt).sort((a,b)=>b[1].inc-a[1].inc).map(([ent,v])=>R(ent,M(v.inc),M(v.exp),M(v.inc-v.exp))),
      R(''),
      R('========== LANCAMENTOS =========='),
      R(''),
      R('#','DATA','DESCRICAO','NATUREZA','CATEGORIA','CONTA','STATUS','VALOR (R$)','TIPO','OBSERVACAO'),
      ...sorted.map((t,i)=>R(i+1,new Date(t.date+'T12:00:00').toLocaleDateString('pt-BR'),t.description,t.type==='income'?'RECEITA':'DESPESA',t.category,entities.find(e=>e.id===t.entityId)?.name||(personalAcc.name||'Conta Pessoal'),t.status==='paid'?'EFETIVADO':'PENDENTE',M(t.amount),(t.isVirtual||t.isRecurring)?'RECORRENTE':'AVULSO',t.note||'')),
      R(''),
      R('TOTAL LANCAMENTOS',items.length,'EFETIVADOS',paid.length,'PENDENTES',pend.length),
      R('Kontaê - Sistema de Gestão Financeira'),
      R('Documento gerado automaticamente. Confira antes de usar para fins contabeis.'),
    ];
    const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Kontae_'+reportName.replace(/ /g,'_')+'_'+tStr()+'.csv';a.click();
  };

  const inp=`w-full px-3.5 py-2.5 border rounded-xl font-medium text-sm outline-none focus:ring-2 focus:ring-[#1D6FA4] transition-all ${th('bg-slate-50 border-slate-200 text-slate-800 focus:bg-white','bg-slate-900 border-slate-700 text-slate-100')}`;

        <div className="flex items-center gap-3 flex-1 min-w-0">
          <div className="w-0.5 h-10 rounded-full shrink-0" style={{backgroundColor:cc}}></div>
          <div className={`w-9 h-9 rounded-xl shrink-0 flex items-center justify-center ${t.type==='income'?th('bg-emerald-50 text-emerald-600','bg-emerald-500/10 text-emerald-400'):isOv?th('bg-rose-100 text-rose-600','bg-rose-500/20 text-rose-400'):th('bg-slate-50 text-slate-500','bg-slate-800 text-slate-400')}`}>
            <Ic n={t.type==='income'?'up':'dn'} s={15}/>
          </div>
          <div className="min-w-0 flex-1">
            <div className="flex items-center flex-wrap gap-1.5 mb-0.5">
              <span className={`text-sm font-semibold truncate ${isOv?th('text-rose-800','text-rose-300'):th('text-slate-800','text-slate-100')}`}>{t.description}</span>
              {(t.isVirtual||t.isRecurring)&&<span className="text-[8px] font-bold uppercase px-1.5 py-0.5 rounded border flex items-center gap-0.5 shrink-0 bg-violet-50 text-violet-600 border-violet-200"><Ic n="rp" s={8}/> Rec.</span>}
              {isOv&&<span className="text-[8px] font-bold text-white bg-rose-500 px-1.5 py-0.5 rounded apu">{dL}d atraso</span>}

              <span>{new Date(t.date+'T12:00:00').toLocaleDateString('pt-BR')}</span>
              <span>·</span><span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full inline-block" style={{backgroundColor:cc}}></span>{t.category}</span>
              <span>·</span><span>{entities.find(e=>e.id===t.entityId)?.name||'Conta Pessoal'}</span>
              {t.note&&<><span>·</span><span className="italic truncate max-w-[100px]">"{t.note}"</span></>}
            </div>
          </div>
        </div>
        <div className={`flex items-center gap-2 shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 w-full sm:w-auto ${th('border-slate-100','border-slate-800')}`} onClick={e=>e.stopPropagation()}>
          <div className="text-left sm:text-right flex-1 sm:flex-none mr-1">
            <span className={`text-[9px] font-bold uppercase tracking-wider block mb-0.5 ${t.status==='paid'?'text-emerald-500':isOv?'text-rose-500':'text-amber-500'}`}>{t.status==='paid'?'Efetivado':isOv?'Vencido':'Pendente'}</span>
            <span className={`text-sm font-bold ${t.type==='income'?th('text-emerald-600','text-emerald-400'):th('text-slate-800','text-white')}`}>{t.type==='income'?'+':'-'}&nbsp;R$&nbsp;{fM(t.amount)}</span>
          </div>

            {t.status==='pending'&&<button onClick={()=>openEf(t)} className={`p-1.5 rounded-lg transition-all ${th('bg-[#E8F2FA] text-[#1D6FA4] hover:bg-[#1D6FA4] hover:text-white','bg-[#1D6FA4]/10 text-[#4A9AC9] hover:bg-[#1D6FA4] hover:text-white')}`}><Ic n="ok" s={13}/></button>}
            <button onClick={()=>openE(t)} className={`p-1.5 rounded-lg border transition-all ${th('text-slate-400 hover:text-[#1D6FA4] border-slate-100','text-slate-500 hover:text-[#4A9AC9] border-slate-700')}`}><Ic n="pn" s={13}/></button>
            <button onClick={()=>rDel(t)} className={`p-1.5 rounded-lg border transition-all ${th('text-slate-300 hover:text-rose-500 border-slate-100','text-slate-600 hover:text-rose-400 border-slate-700')}`}><Ic n="tr" s={13}/></button>
          </div>
        </div>
      </div>
    );
  };

  /* FGroup */
  const FGroup=({label,items,color,badge})=>{
    if(!items.length)return null;
    const cc={red:'text-rose-600 bg-rose-50 border-rose-200',amber:'text-amber-600 bg-amber-50 border-amber-200',blue:'text-[#1D6FA4] bg-[#E8F2FA] border-[#B3D9EC]'};

    return(
      <div className="space-y-2">

  const navItems=[
    {id:'dashboard',n:'gr',l:'Visão Mensal'},
    {id:'forecast',n:'ch',l:'Previsão de Caixa'},

    {id:'impostos',n:'pct',l:'Impostos'},{id:'planos',n:'st',l:'Planos'},{id:'settings',n:'cg',l:'Configurações'},
  ];

  /* ── RENDER ── */

  /* Login / Register Screen */
  if(!user){
    const isLogin=authScreen==='login';
    return(
      <div className={`min-h-screen flex flex-col items-center justify-center px-6 py-12 ${dark?'bg-[#0d2137]':'bg-[#1D6FA4]'}`}>

        {/* ── Logo ── */}
        <div className="flex flex-col items-center mb-10">
          <div className="w-20 h-20 rounded-3xl flex items-center justify-center mb-4" style={{backgroundColor:'#F0B429',boxShadow:'0 8px 32px rgba(240,180,41,0.45)'}}>
            <svg width="56" height="48" viewBox="0 0 40 34" fill="none" xmlns="http://www.w3.org/2000/svg">
              <text x="2" y="16" fontFamily="Plus Jakarta Sans, sans-serif" fontWeight="300" fontSize="16" fill="#1A3A5C" letterSpacing="-0.5">R$</text>
              <path d="M3 27 Q8 22 13 27 Q18 32 23 27 Q28 22 33 27 L36 24" stroke="#1A3A5C" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
              <polyline points="32,22 36,24 33,28" stroke="#1A3A5C" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
            </svg>

            <span style={{color:'white'}}>KONT</span><span style={{color:'#F0B429'}}>AÊ</span>
          </p>
          <p className="text-xs font-medium uppercase tracking-widest" style={{color:"rgba(255,255,255,0.65)"}}>Sistema de Gestão Financeira para Empresas</p>
        </div>

        {/* ── Card ── */}
        <div className="w-full max-w-sm">

          {/* Tabs */}
          <div className="flex p-1 rounded-2xl mb-6 gap-1" style={{backgroundColor:'rgba(255,255,255,0.12)',border:'1px solid rgba(255,255,255,0.18)'}}>
            <button onClick={()=>{setAuthScreen('login');setAuthErr('');}} className="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all" style={isLogin?{backgroundColor:'#F0B429',color:'#1A3A5C'}:{color:'rgba(255,255,255,0.6)'}}>Entrar</button>
            <button onClick={()=>{setAuthScreen('register');setAuthErr('');}} className="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all" style={!isLogin?{backgroundColor:'#F0B429',color:'#1A3A5C'}:{color:'rgba(255,255,255,0.6)'}}>Criar Conta</button>
          </div>

          {/* Form */}
          <form onSubmit={isLogin?doLogin:doRegister} className="space-y-4">
            {!isLogin&&(

                <input required={!isLogin} type="text" value={authForm.name} onChange={e=>setAuthForm({...authForm,name:e.target.value})} placeholder="Ex: Davi" className="w-full px-4 py-3.5 rounded-xl text-sm font-medium outline-none transition-all" style={{backgroundColor:'rgba(255,255,255,0.12)',border:'1.5px solid rgba(255,255,255,0.35)',color:'white'}}
                  onFocus={e=>{e.target.style.border='1.5px solid rgba(255,255,255,0.8)';e.target.style.backgroundColor='rgba(255,255,255,0.18)'}}
                  onBlur={e=>{e.target.style.border='1.5px solid rgba(255,255,255,0.35)';e.target.style.backgroundColor='rgba(255,255,255,0.12)'}}/>
              </div>

                        <div className="flex items-center gap-2">
                          <div className={`w-3 h-3 rounded-full border-2 flex items-center justify-center ${inviteForm.role===op.v?'border-[#1D6FA4]':'border-slate-300'}`}>
                            {inviteForm.role===op.v&&<div className="w-1.5 h-1.5 rounded-full bg-[#1D6FA4]"></div>}
                          </div>
                          <span className={`text-xs font-bold ${inviteForm.role===op.v?'text-[#155D8A]':th('text-slate-700','text-slate-300')}`}>{op.l}</span>
                        </div>
                        <p className={`text-[10px] mt-0.5 ml-5 ${th('text-slate-400','text-slate-500')}`}>{op.d}</p>
                      </button>
                    ))}
                  </div>
                </div>
                <button type="submit" disabled={inviteLoading} className="w-full bg-[#1D6FA4] hover:bg-[#155D8A] disabled:opacity-60 text-white py-2.5 rounded-xl text-xs font-semibold transition-all">{inviteLoading?'Gerando link…':'Gerar Link de Convite'}</button>
              </form>
            ):(
              <div className="space-y-4">
                <div className={`p-3.5 rounded-xl border ${th('bg-emerald-50 border-emerald-200','bg-emerald-950/20 border-emerald-700/40')}`}>
                  <p className="text-xs font-semibold text-emerald-700 mb-1">✅ Link gerado com sucesso!</p>
                  <p className="text-[10px] text-emerald-600">Compartilhe com <strong>{inviteForm.email}</strong>. O link expira após o uso.</p>
                </div>
                <div>
                  <label className="text-[10px] font-bold uppercase tracking-widest text-slate-400 block mb-1">Link de convite</label>
                  <div className="flex gap-2">
                    <input readOnly value={inviteLink} className={`${inp} text-xs flex-1`}/>
                    <button type="button" onClick={()=>{navigator.clipboard.writeText(inviteLink);alert('Link copiado!');}} className="px-3 py-2 bg-[#1D6FA4] text-white rounded-xl text-xs font-semibold shrink-0">Copiar</button>
                  </div>
                </div>
                <p className={`text-[10px] leading-relaxed ${th('text-slate-500','text-slate-400')}`}>📱 Envie este link por WhatsApp ou e-mail. O convidado precisará criar uma conta ao abrir o link.</p>
                <button onClick={()=>{setInviteLink('');setInviteForm({email:'',role:'analista'});}} className={`w-full py-2.5 rounded-xl text-xs font-semibold border ${th('border-slate-200 text-slate-600','border-slate-700 text-slate-300')}`}>Gerar outro convite</button>
              </div>
            )}
          </div>
        </div>
      )}
      {showInviteAccept&&inviteInfo&&(
        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div className={`rounded-2xl shadow-2xl w-full max-w-sm p-6 ${th('bg-white','bg-slate-900')}`}>
            <div className="text-center mb-6">
              <div className="w-14 h-14 rounded-2xl bg-[#1D6FA4] flex items-center justify-center mx-auto mb-3 shadow-lg shadow-[#1D6FA4]/30"><Ic n="us" s={24} c="text-white"/></div>
              <h3 className="text-base font-bold" style={{fontFamily:'var(--font-display)',color:dark?'white':'#0f172a'}}>Convite para Workspace</h3>
              <p className="text-xs text-slate-400 mt-1">Você foi convidado por</p>
              <p className="text-sm font-semibold text-[#1D6FA4] mt-0.5">{inviteInfo.ownerName||inviteInfo.ownerEmail}</p>
            </div>
            <div className={`p-3.5 rounded-xl border mb-5 ${th('bg-slate-50 border-slate-200','bg-slate-800 border-slate-700')}`}>
              <div className="flex justify-between items-center">
                <span className={`text-xs ${th('text-slate-500','text-slate-400')}`}>Seu nível de acesso</span>
                <span className="text-xs font-bold text-[#1D6FA4] bg-[#E8F2FA] border border-[#B3D9EC] px-2.5 py-1 rounded-lg capitalize">{inviteInfo.role}</span>
              </div>
            </div>
            <div className="space-y-2">
              <button onClick={acceptInvite} className="w-full bg-[#1D6FA4] hover:bg-[#155D8A] text-white py-3 rounded-xl font-semibold text-sm transition-all">Aceitar Convite</button>
              <button onClick={()=>{setShowInviteAccept(false);window.history.replaceState({},'',window.location.pathname);setWorkspaceOwnerUid(user?.uid);setUserRole('owner');}} className={`w-full py-2.5 rounded-xl text-xs font-semibold ${th('bg-slate-100 text-slate-600','bg-slate-800 text-slate-300')}`}>Recusar</button>
            </div>
          </div>
        </div>
      )}
      {/* Cloud status */}
      <div className={`fixed bottom-4 right-4 flex items-center gap-2 px-3 py-2 rounded-xl shadow-lg border backdrop-blur-xl z-50 ${th('bg-white/90 border-slate-200','bg-slate-900/90 border-slate-700')}`}>
        {cs==='connecting'&&<><Ic n="rf" s={11} c="asp text-slate-400"/><span className="text-[9px] font-semibold uppercase tracking-wide text-slate-400">Conectando</span></>}
        {cs==='syncing'&&<><Ic n="cl" s={11} c="apu text-[#1D6FA4]"/><span className="text-[9px] font-semibold uppercase tracking-wide text-[#1D6FA4]">Salvando</span></>}
        {cs==='synced'&&<><Ic n="ok" s={11} c="text-emerald-500"/><span className="text-[9px] font-semibold uppercase tracking-wide text-emerald-500">Sincronizado</span></>}
        {cs==='error'&&<><Ic n="wn" s={11} c="text-rose-500"/><span className="text-[9px] font-semibold uppercase tracking-wide text-rose-500">Erro</span></>}
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
